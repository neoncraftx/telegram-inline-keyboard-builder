name: Python tests

on:
  push:
    branches: [main, dev]
    paths:
      - "api/python/**"
      - ".github/workflows/python-test.yml"
  pull_request:
    paths:
      - "api/python/**"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install and test
        working-directory: api/python
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pytest -q
